name: english_class_manager
description: English Class Teacher Attendance, Timetable & Salary Management App
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.9
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  excel: ^4.0.6
  path_provider: ^2.1.3
  open_filex: ^4.7.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  uuid: ^4.4.2
  flutter_colorpicker: ^1.1.0
  provider: ^6.1.2
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
